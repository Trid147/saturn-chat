name: Saturn Chat CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-sast:
    name: Lint & SAST Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter & SAST tools
        run: pip install ruff bandit

      - name: Run Ruff Syntax Linter
        run: ruff check . --select=E9,F63,F7,F82,F401

      - name: Run Bandit SAST Scanner
        run: bandit -r . -x ./.venv,./venv -ll

  build-and-trivy-scan:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-sast  # Waits for Job 1 to pass before starting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Container Image
        run: docker build -t saturn-chat:ci-test .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "saturn-chat:ci-test"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"